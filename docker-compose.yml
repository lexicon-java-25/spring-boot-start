
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped


    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: prod_db

    networks:
      - spring-network
    healthcheck:
      test: ["CMD", "mysqladmin","ping","-h","localhost","-u","root","-prootpassword" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
#    image: spring-docker-demo:v1
#    alternativt
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"

    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/prod_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - spring-network

networks:
  spring-network:
    driver: bridge


